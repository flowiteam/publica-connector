name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    # Laravel 12 only. Testbench rather than illuminate/support, because
    # testbench pulls laravel/framework, which *replaces* illuminate/support and
    # cannot be installed beside it — and Laravel 11 is gone from the matrix for
    # a better reason than tidiness: every 11.x release is under an unpatched
    # advisory, and composer will not install one at all.
    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/phpunit

      - name: Style
        run: vendor/bin/pint --test
