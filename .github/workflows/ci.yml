name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # Testbench, not illuminate/support: testbench pulls in
        # laravel/framework, which *replaces* illuminate/support, and composer
        # refuses to install both. Testbench 9 is Laravel 11, testbench 10 is
        # Laravel 12.
        testbench: ['9.*', '10.*']
        include:
          - testbench: '9.*'
            laravel: '11'
          - testbench: '10.*'
            laravel: '12'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/phpunit

      - name: Style
        run: vendor/bin/pint --test
